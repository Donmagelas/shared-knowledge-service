name: shared-knowledge-service

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ogx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ogx-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-ogx}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c}
    healthcheck:
      # Qdrant 镜像没有 curl；Bash TCP 探针只验证服务端口已监听。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  knowledge-ogx:
    image: shared-knowledge-service-ogx:0.1.0
    build:
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        DOCLING_LAYOUT_MODEL_REVISION: ${DOCLING_LAYOUT_MODEL_REVISION:-8f39ad3c0b4c58e9c2d2c84a38465abf757272d8}
        DOCLING_TABLE_MODEL_REVISION: ${DOCLING_TABLE_MODEL_REVISION:-fc0f2d45e2218ea24bce5045f58a389aed16dc23}
        DOCLING_TOKENIZER_MODEL: ${DOCLING_TOKENIZER_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
        DOCLING_TOKENIZER_REVISION: ${DOCLING_TOKENIZER_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
        PYPI_FILES_URL: ${PYPI_FILES_URL:-https://mirrors.aliyun.com/pypi/packages}
        PYPI_SIMPLE_URL: ${PYPI_SIMPLE_URL:-https://mirrors.aliyun.com/pypi/simple}
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FILES_PROVIDER_TYPE: ${FILES_PROVIDER_TYPE:-inline::localfs}
      FILES_STORAGE_DIR: /data/files
      KNOWLEDGE_ADMIN_TOKEN: ${KNOWLEDGE_ADMIN_TOKEN:-admin-local-only-change-me}
      KNOWLEDGE_CREDENTIAL_MASTER_KEY: ${KNOWLEDGE_CREDENTIAL_MASTER_KEY:-credential-local-only-change-me}
      KNOWLEDGE_FAILED_SOURCE_RETENTION_DAYS: ${KNOWLEDGE_FAILED_SOURCE_RETENTION_DAYS:-7}
      KNOWLEDGE_FILE_CLEANUP_INTERVAL_HOURS: ${KNOWLEDGE_FILE_CLEANUP_INTERVAL_HOURS:-24}
      KNOWLEDGE_INFERENCE_ALLOWED_HOSTS: ${KNOWLEDGE_INFERENCE_ALLOWED_HOSTS:-}
      KNOWLEDGE_INFERENCE_HTTP_ALLOWED_HOSTS: ${KNOWLEDGE_INFERENCE_HTTP_ALLOWED_HOSTS:-}
      KNOWLEDGE_INFERENCE_TIMEOUT_SECONDS: ${KNOWLEDGE_INFERENCE_TIMEOUT_SECONDS:-30}
      KNOWLEDGE_MAX_BATCH_FILES: ${KNOWLEDGE_MAX_BATCH_FILES:-20}
      KNOWLEDGE_MAX_BATCH_UPLOAD_SIZE_BYTES: ${KNOWLEDGE_MAX_BATCH_UPLOAD_SIZE_BYTES:-524288000}
      KNOWLEDGE_MAX_UPLOAD_SIZE_BYTES: ${KNOWLEDGE_MAX_UPLOAD_SIZE_BYTES:-104857600}
      KNOWLEDGE_OUTER_RRF_K: ${KNOWLEDGE_OUTER_RRF_K:-60}
      KNOWLEDGE_RUNTIME_TOKEN: ${KNOWLEDGE_RUNTIME_TOKEN:-runtime-local-only-change-me}
      KNOWLEDGE_SEARCH_BRANCH_CANDIDATE_LIMIT: ${KNOWLEDGE_SEARCH_BRANCH_CANDIDATE_LIMIT:-50}
      KNOWLEDGE_SEARCH_BRANCH_CONCURRENCY: ${KNOWLEDGE_SEARCH_BRANCH_CONCURRENCY:-8}
      KNOWLEDGE_UNCOMMITTED_SOURCE_RETENTION_HOURS: ${KNOWLEDGE_UNCOMMITTED_SOURCE_RETENTION_HOURS:-24}
      POSTGRES_DB: ${POSTGRES_DB:-ogx}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ogx-local-only}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-ogx}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-shared_knowledge}
      QDRANT_URL: http://qdrant:6333
      RERANK_CANDIDATE_LIMIT: ${RERANK_CANDIDATE_LIMIT:-50}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-false}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8321/v1/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "127.0.0.1:${OGX_HOST_PORT:-8321}:8321"
    volumes:
      - original-files:/data/files

volumes:
  original-files:
  postgres-data:
  qdrant-data:
