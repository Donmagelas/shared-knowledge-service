version: 2
distro_name: shared-knowledge-service

apis:
  - file_processors
  - files
  - inference
  - knowledge
  - vector_io

external_apis_dir: config/apis.d

providers:
  inference:
    - provider_id: knowledge-base-inference
      provider_type: remote::knowledge-base-inference
      module: shared_knowledge_service.knowledge_base_inference
      config:
        allowed_hosts: ${env.KNOWLEDGE_INFERENCE_ALLOWED_HOSTS:=}
        credential_master_key: ${env.KNOWLEDGE_CREDENTIAL_MASTER_KEY}
        http_allowed_hosts: ${env.KNOWLEDGE_INFERENCE_HTTP_ALLOWED_HOSTS:=}
        persistence:
          backend: kv_default
          namespace: knowledge_control
        timeout_seconds: ${env.KNOWLEDGE_INFERENCE_TIMEOUT_SECONDS:=30}

  vector_io:
    - provider_id: shared-qdrant
      provider_type: remote::shared-qdrant
      module: shared_knowledge_service
      config:
        api_key: ${env.QDRANT_API_KEY:=}
        collection_name: ${env.QDRANT_COLLECTION_NAME:=shared_knowledge}
        # 需要高性能过滤的业务字段由 Stella/企业版部署时按实际 Payload 契约声明。
        payload_indexes: {}
        persistence:
          backend: kv_default
          namespace: vector_io::shared_qdrant
        rerank_candidate_limit: ${env.RERANK_CANDIDATE_LIMIT:=50}
        sparse_vector_name: bm25
        url: ${env.QDRANT_URL:=http://localhost:6333}

  files:
    - provider_id: builtin-files
      # 部署时可在本地持久卷和 S3/S3-compatible 对象存储之间选择，API 不变。
      provider_type: ${env.FILES_PROVIDER_TYPE:=inline::localfs}
      config:
        auto_create_bucket: ${env.S3_AUTO_CREATE_BUCKET:=false}
        aws_access_key_id: ${env.AWS_ACCESS_KEY_ID:=}
        aws_secret_access_key: ${env.AWS_SECRET_ACCESS_KEY:=}
        bucket_name: ${env.S3_BUCKET_NAME:=}
        endpoint_url: ${env.S3_ENDPOINT_URL:=}
        metadata_store:
          backend: sql_default
          table_name: files_metadata
        region: ${env.AWS_REGION:=us-east-1}
        storage_dir: ${env.FILES_STORAGE_DIR:=/data/files}

  file_processors:
    - provider_id: docling
      provider_type: inline::docling
      config:
        # 固定 OGX 构建补丁会用 800-token 新内容预算，再前置最多 200 tokens。
        default_chunk_overlap_tokens: 200
        default_chunk_size_tokens: 1000
        do_ocr: false
        vlm_model: null

  knowledge:
    - provider_id: shared-knowledge
      provider_type: inline::shared-knowledge
      config:
        admin_token: ${env.KNOWLEDGE_ADMIN_TOKEN}
        allowed_inference_hosts: ${env.KNOWLEDGE_INFERENCE_ALLOWED_HOSTS:=}
        credential_master_key: ${env.KNOWLEDGE_CREDENTIAL_MASTER_KEY}
        failed_source_retention_days: ${env.KNOWLEDGE_FAILED_SOURCE_RETENTION_DAYS:=7}
        file_cleanup_interval_hours: ${env.KNOWLEDGE_FILE_CLEANUP_INTERVAL_HOURS:=24}
        http_allowed_inference_hosts: ${env.KNOWLEDGE_INFERENCE_HTTP_ALLOWED_HOSTS:=}
        inference_timeout_seconds: ${env.KNOWLEDGE_INFERENCE_TIMEOUT_SECONDS:=30}
        max_batch_files: ${env.KNOWLEDGE_MAX_BATCH_FILES:=20}
        max_batch_upload_size_bytes: ${env.KNOWLEDGE_MAX_BATCH_UPLOAD_SIZE_BYTES:=524288000}
        max_upload_size_bytes: ${env.KNOWLEDGE_MAX_UPLOAD_SIZE_BYTES:=104857600}
        outer_rrf_k: ${env.KNOWLEDGE_OUTER_RRF_K:=60}
        persistence:
          backend: kv_default
          namespace: knowledge_control
        runtime_token: ${env.KNOWLEDGE_RUNTIME_TOKEN}
        search_branch_candidate_limit: ${env.KNOWLEDGE_SEARCH_BRANCH_CANDIDATE_LIMIT:=50}
        search_branch_concurrency: ${env.KNOWLEDGE_SEARCH_BRANCH_CONCURRENCY:=8}
        uncommitted_source_retention_hours: ${env.KNOWLEDGE_UNCOMMITTED_SOURCE_RETENTION_HOURS:=24}

storage:
  backends:
    kv_default:
      type: kv_postgres
      db: ${env.POSTGRES_DB:=ogx}
      host: ${env.POSTGRES_HOST:=localhost}
      password: ${env.POSTGRES_PASSWORD:=ogx-local-only}
      port: ${env.POSTGRES_PORT:=5432}
      table_name: ogx_kvstore
      user: ${env.POSTGRES_USER:=ogx}
    sql_default:
      type: sql_postgres
      db: ${env.POSTGRES_DB:=ogx}
      host: ${env.POSTGRES_HOST:=localhost}
      max_overflow: 10
      password: ${env.POSTGRES_PASSWORD:=ogx-local-only}
      pool_pre_ping: true
      pool_size: 5
      port: ${env.POSTGRES_PORT:=5432}
      user: ${env.POSTGRES_USER:=ogx}
  stores:
    inference:
      backend: sql_default
      table_name: inference_store
    metadata:
      backend: kv_default
      namespace: registry
    vector_stores:
      backend: sql_default
      table_name: vector_store_metadata

registered_resources:
  models: []
  vector_stores: []

server:
  auth:
    provider_config:
      # 回调位于同一进程，只接受 Admin Token；Knowledge API 路由自行鉴权。
      endpoint: http://127.0.0.1:8321/knowledge/v1/internal/auth/validate
      type: custom
  port: 8321

vector_stores:
  default_provider_id: shared-qdrant
  file_ingestion_params:
    # 与 Docling Provider 保持相同的最终上限和 overlap 契约。
    default_chunk_overlap_tokens: 200
    default_chunk_size_tokens: 1000
  chunk_retrieval_params:
    default_search_mode: hybrid
    default_reranker_strategy: rrf
